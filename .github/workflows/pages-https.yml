# Technical SEO: makes sure GitHub Pages serves thewinegoat.com only over HTTPS (server-level 301 from HTTP),
# then tests the live redirects, canonicals, robots.txt, sitemap and favicon from outside and commits the report
# to tools/seo_tech/live_report.md. Runs on demand, when this file changes, and every Monday.
name: Pages HTTPS + live SEO check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pages-https.yml", "tools/seo_tech/live_check.sh"]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: write
  pages: write
concurrency: { group: pages-https, cancel-in-progress: false }
jobs:
  https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Pages configuration (before)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p tools/seo_tech
          gh api "repos/${{ github.repository }}/pages" > /tmp/pages_before.json || echo '{"error":"cannot read pages config"}' > /tmp/pages_before.json
          cat /tmp/pages_before.json
      - name: Enforce HTTPS (301 http -> https at the GitHub Pages edge)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if jq -e '.https_enforced == true' /tmp/pages_before.json >/dev/null; then echo "already enforced" > /tmp/enforce.txt;
          else
            gh api -X PUT "repos/${{ github.repository }}/pages" -F https_enforced=true -f cname=thewinegoat.com > /tmp/enforce.txt 2>&1 \
              && echo "PUT https_enforced=true: OK" >> /tmp/enforce.txt || echo "PUT https_enforced=true: FAILED (see message above)" >> /tmp/enforce.txt
          fi
          cat /tmp/enforce.txt
          gh api "repos/${{ github.repository }}/pages" > /tmp/pages_after.json || true
          gh api "repos/${{ github.repository }}/pages/health" > /tmp/pages_health.json 2>&1 || true
          gh api "repos/${{ github.repository }}/pages/builds?per_page=10" --jq '[.[] | {status, created_at, commit: .commit[0:7], error: .error.message, duration}]' > /tmp/pages_builds.json 2>&1 || true
      - name: Live checks
        run: |
          sleep 60
          bash tools/seo_tech/live_check.sh > /tmp/live.md 2>&1 || true
      - name: Commit report
        run: |
          {
            echo "# Live technical SEO report"; echo; echo "Generated by the workflow on $(date -u '+%Y-%m-%d %H:%M UTC')."; echo
            echo "## GitHub Pages configuration (before)"; echo '```json'; cat /tmp/pages_before.json; echo; echo '```'
            echo "## Enforce HTTPS"; echo '```'; cat /tmp/enforce.txt; echo '```'
            echo "## GitHub Pages configuration (after)"; echo '```json'; cat /tmp/pages_after.json 2>/dev/null; echo; echo '```'
            echo "## Latest GitHub Pages builds"; echo '```json'; cat /tmp/pages_builds.json 2>/dev/null; echo; echo '```'
            echo "## GitHub Pages DNS health check"; echo '```json'; cat /tmp/pages_health.json 2>/dev/null; echo; echo '```'
            cat /tmp/live.md
          } > tools/seo_tech/live_report.md
          python3 - <<'PY'
          import json, re
          a = json.load(open('/tmp/pages_after.json')) if open('/tmp/pages_after.json').read().strip().startswith('{') else {}
          r = open('tools/seo_tech/live_report.md').read()
          m = re.search(r'REDIRECT MATRIX: (\d+) PASS, (\d+) FAIL', r)
          c = a.get('https_certificate') or {}
          head = ["## Summary (all values below were obtained live during this run)", "",
                  f"- API https_enforced: **{a.get('https_enforced')}**",
                  f"- API certificate state: **{c.get('state')}**, domains: {c.get('domains')}, expires {c.get('expires_at')}",
                  f"- Redirect matrix: **{m.group(1)} PASS, {m.group(2)} FAIL**" if m else "- Redirect matrix: not run", ""]
          r = r.replace('## GitHub Pages configuration (before)', '\n'.join(head) + '\n## GitHub Pages configuration (before)', 1)
          open('tools/seo_tech/live_report.md', 'w').write(r)
          PY
          mkdir -p tools/seo_tech/reports && cp tools/seo_tech/live_report.md "tools/seo_tech/reports/$(date -u +%Y-%m-%d_%H%M).md"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/seo_tech/live_report.md tools/seo_tech/reports
          git commit -m "Live SEO report [skip ci]" || exit 0
          cat tools/seo_tech/live_report.md; set +e; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 7; done
