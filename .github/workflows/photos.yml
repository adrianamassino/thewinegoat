# Downloads the free Wikimedia Commons photos listed in tools/photos/queries.csv, optimises them to WebP and
# commits them with their credits to img/photos/. Runs when tools/photos/fetch.py or queries.csv change, or on demand.
name: Fetch photos (Wikimedia Commons)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/photos/fetch.py", "tools/photos/queries.csv"]
permissions:
  contents: write
concurrency: { group: photos, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow
      - name: Fetch
        run: python3 tools/photos/fetch.py --limit 1000 | tail -40
      - name: Commit
        run: |
          set +e
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/photos
          git commit -qm "Photos from Wikimedia Commons (free licences, with credits) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 7; done
