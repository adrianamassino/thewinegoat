# High-quality free photos from Pixabay, Pexels and Unsplash (tools/photos/stock.py).
# Needs repository secrets PIXABAY_API_KEY / PEXELS_API_KEY / UNSPLASH_ACCESS_KEY (Settings → Secrets and variables → Actions).
# A source without its secret is skipped. Run it from the Actions tab ("Run workflow") once the secrets are set.
name: Fetch stock photos (Pixabay, Pexels, Unsplash)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/photos/stock.py"]
permissions:
  contents: write
concurrency: { group: stock-photos, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow
      - name: Fetch
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          git pull -q --rebase origin main || true
          python3 tools/photos/stock.py --per-query 2 --limit 600 | tail -40
      - name: Commit
        run: |
          set +e
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/photos
          git commit -qm "Stock photos (Pixabay/Pexels/Unsplash, free licences, credited) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 7; done
