<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- base href + window.REEL are injected by tools/social/build.js -->
<!--BASE-->
<link rel="stylesheet" href="tools/social/templates/base.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden;background:#fbf7f1}
#cv{width:1080px;height:1920px;position:relative;overflow:hidden;color:#2a1b20;--acc:#8c1d40;--acc-ink:#fff;--grad:radial-gradient(120% 140% at 0% 0%,#a3264f 0%,#7a1838 50%,#3e0f22 100%)}
#cv.c-spirits{--acc:#9a5f1e}#cv.c-sake{--acc:#3b3f8f}#cv.c-beer{--acc:#d4a23a;--acc-ink:#2a1b20}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#fdfaf6 0%,#fbf7f1 55%,#f3ebe1 100%)}
#glow{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(246,205,216,.85) 0%,rgba(249,223,230,0) 65%)}
#glow2{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(251,232,200,.9) 0%,rgba(251,239,217,0) 65%)}
#band{position:absolute;left:0;right:0;bottom:0;height:300px;background:var(--grad)}
#acc{position:absolute;left:0;right:0;top:0;height:14px;background:var(--acc);z-index:6}
.rbrand{position:absolute;top:262px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;z-index:5}
.rbrand img.em{width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(140,29,64,.25)}
.rbrand img.wm{height:48px}
#rbadge{position:absolute;top:352px;left:50%;transform:translateX(-50%);z-index:5;background:var(--acc);color:var(--acc-ink);font:800 24px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:13px 20px;border-radius:999px;white-space:nowrap}
#prog{position:absolute;top:414px;left:160px;right:160px;height:6px;border-radius:3px;background:rgba(140,29,64,.12);z-index:5}
#prog i{display:block;height:100%;width:0;border-radius:3px;background:var(--grad)}
.scene{position:absolute;left:90px;right:90px;top:470px;height:960px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0}
.scene .kicker{font-size:30px;margin-bottom:20px;color:#8c1d40}
.scene .rt{font:800 100px/1.02 var(--serif);color:#6e1532;letter-spacing:-.01em}
.scene .rt em{font-style:italic;font-weight:600;color:#8c1d40}
.scene .rtag{display:inline-block;margin-top:22px;font:800 24px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border-radius:999px;background:#f6e3e8;color:#8c1d40}
.scene .lines{margin-top:38px;display:flex;flex-direction:column;gap:18px;width:100%}
.scene .ln{font:600 40px/1.25 var(--sans);background:#fff;border:2px solid #eadfd4;border-left:10px solid #8c1d40;border-radius:22px;padding:22px 28px;opacity:0;text-align:left;box-shadow:0 10px 24px rgba(110,21,50,.07)}
.scene .ln b{color:#8c1d40}
.scene .vis{margin-top:30px}
.rgoat,.rart{position:absolute;left:50%;z-index:2;filter:drop-shadow(0 18px 26px rgba(110,21,50,.18));opacity:0}
#cap{position:absolute;left:80px;right:80px;top:1440px;min-height:120px;display:flex;align-items:center;justify-content:center;z-index:6}
#cap span{display:inline-block;background:rgba(42,27,32,.86);color:#fff;font:700 38px/1.3 var(--sans);padding:16px 26px;border-radius:18px;text-align:center;max-width:920px}

/* background families (same as feed v2): dark ones get light text */
#cv.bg-burgundy #bg{background:radial-gradient(120% 70% at 100% 80%,#9c2a50 0%,#6e1532 40%,#3e0f22 80%,#2a0816 100%)}
#cv.bg-wine #bg{background:radial-gradient(120% 70% at 100% 80%,#2f6b54 0%,#1d4a39 40%,#123326 80%,#0b2219 100%)}
#cv.bg-spirits #bg{background:radial-gradient(120% 70% at 100% 80%,#7d4e27 0%,#53321a 40%,#36200f 80%,#24150a 100%)}
#cv.bg-sake #bg{background:radial-gradient(120% 70% at 100% 80%,#4a50b0 0%,#2f337f 40%,#1e2158 80%,#13153a 100%)}
#cv.bg-beer #bg{background:radial-gradient(120% 70% at 100% 80%,#c28a1c 0%,#8a5a0e 42%,#5e3b07 80%,#452b05 100%)}
#cv.dk #glow,#cv.dk #glow2{opacity:.12}
#cv.dk .scene .rt{color:#fff}
#cv.dk .scene .rt em{color:#f3d58c}
#cv.dk .scene .kicker{color:#f3d58c}
#cv.dk .scene .rtag{background:rgba(255,255,255,.14);color:#f3d58c}
#cv.dk .scene .ln{border-color:rgba(255,255,255,.2);border-left-color:#f3d58c;box-shadow:0 10px 24px rgba(0,0,0,.25)}
#cv.dk #prog{background:rgba(255,255,255,.18)}
#cv.dk #prog i{background:#f3d58c}
#cv.dk #rbadge{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
#cv.dk .rbrand img.em{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
#cv.dk .rart{filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 16px rgba(255,255,255,.3))}
#cv.dk .rgoat{filter:drop-shadow(0 18px 26px rgba(0,0,0,.4))}
#cv.dk #band{opacity:.55}
#cv.dk #cap span{background:rgba(255,255,255,.95);color:#2a1b20}
</style>
</head><body>
<div id="cv">
  <div id="bg"></div><div id="glow"></div><div id="glow2"></div><div id="band"></div><div id="acc"></div>
  <div class="rbrand"><img class="em" src="img/logo-emblem.webp" alt=""><img class="wm" src="img/wordmark.webp" alt=""></div><div id="rbadge"></div>
  <div id="prog"><i></i></div>
  <div id="scenes"></div>
  <div id="cap"><span></span></div>
</div>
<script>
// Deterministic animation: window.render(t) draws the frame at time t (seconds).
const R = window.REEL;
document.getElementById('cv').classList.add('c-' + R.course);
if (R.bgc && R.bgc !== 'cream') { document.getElementById('cv').classList.add('bg-' + R.bgc, 'dk'); document.querySelector('.rbrand img.wm').src = 'img/wordmark-light.webp'; }
document.getElementById('rbadge').textContent = R.badge;
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const host = document.getElementById('scenes');
const sceneEls = R.scenes.map((s, i) => {
  const d = document.createElement('div');
  d.className = 'scene';
  d.innerHTML = `${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}<div class="rt" style="${s.titleSize ? `font-size:${s.titleSize}px` : ''}">${s.title}</div>${s.tag ? `<div><span class="rtag">${s.tag}</span></div>` : ''}<div class="lines">${(s.lines || []).map((l) => `<div class="ln">${l}</div>`).join('')}</div>${s.vis ? `<div class="vis">${s.vis}</div>` : ''}`;
  host.appendChild(d);
  let g = null;
  if (s.art) {
    g = document.createElement('div');
    g.className = 'rart'; g.innerHTML = s.art.svg;
    g.style.top = (s.art.top || 1000) + 'px';
    document.getElementById('cv').appendChild(g);
  } else if (s.goat) {
    g = document.createElement('img');
    g.className = 'rgoat'; g.src = s.goat.src;
    g.style.height = (s.goat.h || 420) + 'px';
    g.style.top = (s.goat.top || 980) + 'px';
    document.getElementById('cv').appendChild(g);
  }
  return { d, g, lines: [...d.querySelectorAll('.ln')] };
});
const total = R.scenes[R.scenes.length - 1].end;
const cap = document.querySelector('#cap span');

window.render = (t) => {
  // background drift
  const gl = document.getElementById('glow');
  gl.style.left = (90 + Math.sin(t * 0.35) * 120) + 'px';
  gl.style.top = (300 + Math.cos(t * 0.28) * 160) + 'px';
  const g2 = document.getElementById('glow2');
  g2.style.left = (300 + Math.cos(t * 0.31) * 140) + 'px';
  g2.style.top = (900 + Math.sin(t * 0.25) * 140) + 'px';
  document.querySelector('#prog i').style.width = (clamp(t / total, 0, 1) * 100) + '%';
  let capText = '';
  R.scenes.forEach((s, i) => {
    const { d, g, lines } = sceneEls[i];
    const fin = 0.45, fout = 0.35;
    const local = t - s.start, dur = s.end - s.start;
    let a = 0;
    if (local >= 0 && local <= dur) {
      a = Math.min(ease(local / fin), i === R.scenes.length - 1 ? 1 : ease((dur - local) / fout));
      if (s.holdLast && local > dur - fout) a = 1;
    }
    d.style.opacity = a;
    d.style.transform = `translateY(${(1 - a) * 40}px)`;
    lines.forEach((ln, j) => {
      const st = 0.5 + j * (s.lineGap || 0.55);
      const la = ease((local - st) / 0.4);
      ln.style.opacity = Math.min(la, a);
      ln.style.transform = `translateY(${(1 - la) * 24}px)`;
    });
    if (g) {
      const ga = Math.min(a, ease((local - 0.15) / 0.6));
      const bob = Math.sin((t + i) * 2.0) * 10;
      const rot = Math.sin((t + i) * 1.3) * 1.6;
      const sc = 0.94 + 0.06 * ga + Math.sin(t * 0.9) * 0.008;
      g.style.opacity = ga;
      g.style.transform = `translateX(-50%) translateY(${bob + (1 - ga) * 60}px) rotate(${rot}deg) scale(${sc})`;
    }
    if (local >= 0 && local < dur) capText = s.caption || '';
  });
  cap.textContent = capText;
  cap.style.display = capText ? 'inline-block' : 'none';
};
window.reelReady = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]);
</script>
</body></html>
